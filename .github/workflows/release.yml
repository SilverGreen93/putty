name: Publish Plus release

on:
  push:
    tags:
      - 'PlusR*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Work out release name
        id: name
        shell: bash
        run: |
          R="${GITHUB_REF_NAME#Plus}"     # e.g. PlusR4 -> R4
          # version.h has e.g. #define TEXTVER "Release 0.84 Plus R4"
          TEXTVER="$(sed -n 's/^#define TEXTVER "\(.*\)"/\1/p' version.h)"
          BASE="$(echo "$TEXTVER" | sed -n 's/^Release \([0-9][0-9.]*\) Plus .*/\1/p')"
          echo "zip=PuTTYPlus${R}.zip" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then
            echo "name=PuTTY Plus ${BASE} ${R}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            # version.h didn't match: publish as a draft so it can be
            # titled by hand.
            echo "name=PuTTY Plus ${R}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        # VS generator is multi-config: the Release config is chosen by
        # --config at build time, so CMAKE_BUILD_TYPE is not needed here.
        run: cmake -S . -B build

      - name: Build putty
        run: cmake --build build --config Release --target putty

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/putty.exe dist/putty-plus.exe
          Copy-Item putty_themes.reg, LICENSE.txt dist/
          Compress-Archive -Path dist/putty-plus.exe, dist/putty_themes.reg, dist/LICENSE.txt `
                           -DestinationPath "dist/${{ steps.name.outputs.zip }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.name.outputs.name }}
          draft: ${{ steps.name.outputs.draft == 'true' }}
          files: dist/${{ steps.name.outputs.zip }}
