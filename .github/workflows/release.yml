name: Publish Plus release

on:
  push:
    tags:
      - 'PlusR*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Work out release name
        id: name
        shell: bash
        run: |
          R="${GITHUB_REF_NAME#Plus}"     # e.g. PlusR4 -> R4
          # version.h has e.g. #define TEXTVER "Release 0.84 Plus R4"
          TEXTVER="$(sed -n 's/^#define TEXTVER "\(.*\)"/\1/p' version.h)"
          BASE="$(echo "$TEXTVER" | sed -n 's/^Release \([0-9][0-9.]*\) Plus .*/\1/p')"
          echo "zip=PuTTYPlus${R}.zip" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then
            echo "name=PuTTY Plus ${BASE} ${R}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            # version.h didn't match: publish as a draft so it can be
            # titled by hand.
            echo "name=PuTTY Plus ${R}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        # VS generator is multi-config: the Release config is chosen by
        # --config at build time, so CMAKE_BUILD_TYPE is not needed here.
        run: cmake -S . -B build

      - name: Build all targets
        # No --target: builds ALL_BUILD, so every program in the tree comes
        # out as well as the test binaries; the Package step below picks out
        # of those what actually goes in the zip.
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          # Built by ALL_BUILD, but not meant for the release zip:
          # psocks is a SOCKS proxy test helper, puttytel is the
          # Telnet-only frontend.
          $skip = @('psocks.exe', 'puttytel.exe')
          New-Item -ItemType Directory dist | Out-Null
          $files = @()
          foreach ($exe in Get-ChildItem build/Release/p*.exe) {
            if ($skip -contains $exe.Name) { continue }
            # putty.exe is renamed so this fork's binary doesn't collide
            # with an official PuTTY install.
            $name = if ($exe.Name -eq 'putty.exe') { 'putty-plus.exe' } else { $exe.Name }
            Copy-Item $exe.FullName -Destination "dist/$name"
            $files += "dist/$name"
          }
          Copy-Item putty_themes.reg, LICENSE.txt -Destination dist/
          $files += 'dist/putty_themes.reg'
          $files += 'dist/LICENSE.txt'
          Write-Output "Packaging: $($files -join ', ')"
          Compress-Archive -Path $files -DestinationPath "dist/${{ steps.name.outputs.zip }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.name.outputs.name }}
          draft: ${{ steps.name.outputs.draft == 'true' }}
          files: dist/${{ steps.name.outputs.zip }}
